[package]
name = "dispatcher"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "dispatcher"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
testing = []


[dependencies]
anchor-lang = "1.0.2"
spl-associated-token-account = "1.1.1"
spl-token = "3.5.0"
yield-adapter-interface = { path = "../../crates/yield-adapter-interface" }


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
